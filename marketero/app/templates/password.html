{% extends "base.html" %}
{% block title %}Trocar senha{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <div class="card-body">
    <h1 class="h5 mb-3">Trocar senha</h1>
    <form method="post" action="{{ url('/senha') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label">Senha atual</label><input type="password" name="current" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Nova senha (mín. 10 caracteres)</label><input type="password" name="new" class="form-control" minlength="10" required></div>
      <div class="mb-3"><label class="form-label">Confirmar nova senha</label><input type="password" name="confirm" class="form-control" required></div>
      <button class="btn btn-mkt">Salvar</button>
    </form>
  </div>
</div>
{% endblock %}
