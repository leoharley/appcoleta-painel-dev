<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Marketero{% endblock %} · Instituto Alves Lima</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url('/static/style.css') }}?v=2" rel="stylesheet">
</head>
<body>
{% if logged_in %}
<nav class="navbar navbar-expand-lg navbar-dark bg-mkt">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{{ url('/') }}">Marketero</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url('/conversas') }}">Conversas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url('/contatos') }}">Contatos</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url('/importar') }}">Importar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url('/campanhas') }}">Campanhas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url('/modelos') }}">Templates</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url('/configuracoes') }}">Configurações</a></li>
      </ul>
      <span class="navbar-text me-3 small">{{ username }}</span>
      <a class="btn btn-sm btn-outline-light me-2" href="{{ url('/senha') }}">Senha</a>
      <form method="post" action="{{ url('/logout') }}" class="d-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn btn-sm btn-light">Sair</button>
      </form>
    </div>
  </div>
</nav>
{% endif %}
<main class="container-xl py-4">
  {% for kind, msg in flashes %}
  <div class="alert alert-{{ kind }} alert-dismissible fade show" role="alert">{{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
