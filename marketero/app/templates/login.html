{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="card login-card">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Marketero</h1>
    <p class="text-muted small mb-4">Instituto Alves Lima</p>
    <form method="post" action="{{ url('/login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label">Usuário</label>
        <input name="username" class="form-control" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Senha</label>
        <input name="password" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-mkt w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
