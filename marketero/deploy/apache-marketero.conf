# Marketero (FastAPI em 127.0.0.1:8100) publicado em https://institutoalveslima.com.br/marketero
# Incluído no vhost 443 do institutoalveslima.com.br (producao-le-ssl.conf).
RedirectMatch 301 ^/marketero$ /marketero/
ProxyPass        /marketero/ http://127.0.0.1:8100/ retry=0 timeout=180
ProxyPassReverse /marketero/ http://127.0.0.1:8100/
<Location /marketero/>
    # Uploads (CSV, páginas salvas, .md) cabem com folga; impede corpos gigantes esgotarem a memória
    LimitRequestBody 20971520
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</Location>
# Webhook da Meta: público (sem login), notificações pequenas
<Location /marketero/webhook/>
    LimitRequestBody 1048576
</Location>
